name: Validate product

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build plugin package
        run: python3 scripts/build_plugin.py
      - name: Check generated plugin is current
        run: git diff --exit-code -- plugins/codex-team
      - name: Check Python syntax
        run: python3 -m py_compile codex_team.py server.py skill/codex-team/scripts/launch.py scripts/*.py
      - name: Run product smoke test
        run: python3 scripts/smoke_test.py
